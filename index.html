<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵婭的歌單~</title>
<link rel="stylesheet" href="style.css?ver=2602080416">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>

<body>
<dialog id="name-dialog" class="name-dialog">
    <form id="name-form" method="dialog">
        <h2>點歌提示</h2>
        <p>輸入Youtube上的名字比較有優先權</p>
        <p>任意金額贊助可插隊</p>
        <label for="user-name">YouTube 名字</label>
        <input id="user-name" name="user-name" type="text" maxlength="50" placeholder="請輸入名字（可留白）" autocomplete="nickname">
        <button type="submit">確認</button>
    </form>
</dialog>
<div class="card">
    <h1 style="user-select: none;">歌單搜尋~</h1>
    <div class="current-user" aria-live="polite">
        <span>名字：<strong id="current-user-name">未設定</strong></span>
        <button id="edit-name" type="button">編輯</button>
    </div>
    <div style="display: flex; align-items: center; justify-content: center;">
        <a href="https://forms.gle/q3caCSeAQQQg2ZLm7" class="icon-link" data-tooltip="許願清單" target="_blank" style="font-size: 20px;top: -20px;">
            <i class="fa-regular fa-file-lines fa-2xl" style="position: relative;margin-left: 0px;color: #b987ff;text-shadow: -1px -1px 1px #7e3bff;transform: translate(0px, 20px);"></i>
        </a>
        <input id="kw" placeholder="輸入曲名 / 歌手 / 語言 / 關鍵字" />
        <i id="rdsong" class="fa-solid fa-shuffle fa-2xl" style="right: 40px; position: relative; color: #882eff7a;"></i>
    </div>
    <div class="result" id="result"></div>
    <div id="order-toast" class="order-toast" role="status" aria-live="polite"></div>
    <div class="tooltip-link">
        <a href="https://www.youtube.com/@Sydney_Viya_0525/featured" class="icon-link" data-tooltip="YouTube" target="_blank">
            <i class="fa-brands fa-square-youtube fa-2xs" style="color: #ff0000;"></i>
        </a>
        <a href="https://x.com/Sydney_Viya0525" class="icon-link" data-tooltip="X" target="_blank">
            <i class="fa-brands fa-square-x-twitter fa-2xs" style="color: #000000;"></i>
        </a>
        <a href="https://www.instagram.com/sydney_viya_0525/" class="icon-link" data-tooltip="instagram" target="_blank">
            <i class="fa-brands fa-square-instagram fa-2xs" style="background: linear-gradient(205deg, #f314ff, #ff3535, #f7c000);
                background-clip: text;
                color: transparent;
                line-height: normal;"></i>
        </a>
        <a href="https://snve0525.onrender.com/" class="icon-link" data-tooltip="贊助" target="_blank">
            <i class="fa-brands fa-cash-app fa-2xs" style="color: #000000;"></i>
        </a>
    </div>
</div>
<footer style="color: #858585e3;font-size: 10px;user-select: none;position: absolute;bottom: 0px;">
    <p style="margin:0px;">© 2026 <a href="https://x.com/shiroshio0507" style="text-decoration: none;color: inherit;"  target="_blank">しお(shiroshio)</a>. All rights reserved.</p>
</footer>
</body>
<script src="scripts.js?ver=2602080412"></script>

</html>
