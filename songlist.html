<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>今日點歌</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #f5f5f7;
            color: #29262f;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                sans-serif;
        }

        .container {
            flex: 1 1 auto;
            width: min(1000px, calc(100% - 32px));
            min-height: 0;
            overflow: hidden;
            margin: 40px auto 10px;
            display: flex;
            flex-direction: column;
        }

        .page-footer {
            flex: 0 0 auto;
            width: 100%;
            margin: 0 auto 6px;
            color: #858585e3;
            font-size: 10px;
            text-align: center;
            user-select: none;
        }

        .page-footer p {
            margin: 0;
        }

        /* =========================
           Header
           ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 18px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;
            background: #eee8f7;

            font-size: 20px;
        }

        .title h1 {
            margin: 0;
            font-size: 22px;
        }

        .count {
            margin-top: 3px;
            color: #918c98;
            font-size: 13px;
        }

        .refresh-button {
            border: 1px solid #e3dfe7;
            background: white;

            padding: 9px 14px;
            border-radius: 9px;

            color: #625d68;
            cursor: pointer;

            transition: 0.15s;
        }

        .refresh-button:hover {
            background: #f8f7fa;
        }

        .filter-container {
            position: relative;
            margin-bottom: 14px;
        }

        .header .filter-container {
            margin-bottom: 0;
            margin-left: auto;
        }

        .filter-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 14px;
            border: 1px solid #e3dfe7;
            border-radius: 9px;
            background: white;
            color: #59535f;
            cursor: pointer;
        }

        .filter-button:hover {
            background: #f8f7fa;
        }

        .filter-menu {
            position: absolute;
            top: calc(100% + 5px);
            bottom: auto;
            left: 0;
            z-index: 100;
            display: none;
            width: 150px;
            padding: 6px;
            border: 1px solid #e5e0e8;
            border-radius: 9px;
            background: white;
            box-shadow: 0 8px 25px rgba(40, 30, 50, 0.10);
        }

        .filter-menu.open {
            display: block;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 6px;
            color: #59535f;
            cursor: pointer;
            font-size: 13px;
        }

        .filter-option:hover {
            background: #f5f2f7;
        }

        /* =========================
           Table
           ========================= */

        .table-wrapper {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow-x: auto;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;

            background-color: rgba(255, 255, 255, 0.22);
            background-image: url("img/IMG_0537.png");
            background-position: center bottom;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: scroll;

            border: 1px solid #e8e4eb;
            border-radius: 14px;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .table-wrapper.lyrics-mode tbody > tr:not(.lyrics-row) {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto;

            /*min-width: 650px;*/
        }

        thead {
            background: #faf9fb;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #faf9fb;
        }

        th,
        td {
            padding: 6px 3px;

            text-align: center;

            border-bottom: 1px solid #eeeaf0;

            font-size: 14px;
        }

        th {
            color: #77717e;
            font-size: 13px;
            font-weight: 600;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody td {
            position: relative;
            z-index: 0;
            background: rgba(255, 255, 255, 0.58);
        }

        tbody td:has(.status-menu.open) {
            z-index: 200;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.68);
        }

        tbody tr:hover td {
            background: rgba(255, 255, 255, 0.68);
        }

        tbody tr.lyrics-row:hover,
        tbody tr.lyrics-row:hover td {
            background: transparent;
        }

        tbody tr:first-child td:first-child {
            border-top-left-radius: 10px;
        }

        tbody tr:first-child td:last-child {
            border-top-right-radius: 10px;
        }

        tbody tr:last-child td:first-child {
            border-bottom-left-radius: 10px;
        }

        tbody tr:last-child td:last-child {
            border-bottom-right-radius: 10px;
        }

        /* 欄位 */

        .index {
            width: 7%;

            color: #aaa4af;
            font-weight: 600;
        }

        th:nth-child(2),
        td:nth-child(2) {
            white-space: nowrap;
            text-align: left;
        }

        th:nth-child(3),
        td:nth-child(3) {
            width: 1%;
            white-space: nowrap;
            text-align: left;
        }

        th:nth-child(4),
        td:nth-child(4) {
            width: 26%;
        }

        .song {
            font-weight: 600;
            overflow: hidden;
        }

        .song-content {
            display: flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
        }

        .lyrics-toggle {
            flex: 0 0 24px;
            width: 24px;
            height: 24px;
            padding: 0;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #8d72b8;
            cursor: pointer;
        }

        .lyrics-toggle:hover,
        .lyrics-toggle[aria-expanded="true"] {
            background: #eee8f7;
        }

        .song-copy {
            min-width: 0;
            flex: 1 1 auto;
        }

        .song [data-action="copy-song"] {
            display: block;
            padding: 0 2px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .song [data-action="copy-song"]:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(141, 114, 184, 0.35);
            box-shadow: 0 4px 10px rgba(90, 70, 120, 0.1);
            backdrop-filter: blur(2px);
            transform: translateY(-2px);
        }

        .song-title,
        .song-artist {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .song-title {
            font-weight: 600;
        }

        .song-artist {
            color: #77717e;
            font-size: 12px;
            font-weight: 400;
        }

        .lyrics-row[hidden] {
            display: none;
        }

        .lyrics-row {
            position: absolute;
            z-index: 1000;
            display: block;
        }

        .lyrics-row td {
            display: block;
            width: 100%;
            padding: 0 0 8px;
            background: transparent;
        }

        .lyrics-panel {
            position: relative;
            container-type: inline-size;
            max-height: 100%;
            padding: 38px 10px 9px;
            border: 1px solid #e5e0e8;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.56);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
            box-shadow: 0 10px 28px rgba(40, 30, 50, 0.2);
            transform-origin: center center;
            animation: lyricsFlipIn 0.42s cubic-bezier(0.22, 0.72, 0.24, 1);
        }

        .lyrics-panel.maximized {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 28px;
            grid-template-rows: auto minmax(0, 1fr) auto;
            column-gap: 10px;
            padding-right: 3px;
            left: 0px;
        }

        .lyrics-panel.maximized .lyrics-lines {
            grid-column: 1;
            grid-row: 2;
            flex: 1 1 auto;
            height: auto;
            max-height: 100%;
            min-height: 0;
            overflow: hidden;
            overflow-x: hidden;
        }

        @keyframes lyricsFlipIn {
            from {
                opacity: 0;
                transform: perspective(900px) rotateY(-88deg) scale(0.94);
            }

            to {
                opacity: 1;
                transform: perspective(900px) rotateY(0) scale(1);
            }
        }

        .lyrics-back {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 3;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border: 1px solid #e3dfe7;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.72);
            color: #625d68;
            cursor: pointer;
        }

        .lyrics-back:hover {
            background: #eee8f7;
        }

        .lyrics-panel::before,
        .lyrics-panel::after {
            position: absolute;
            right: 0;
            left: 0;
            z-index: 1;
            height: 18px;
            content: "";
            pointer-events: none;
        }

        .lyrics-panel::before {
            top: 0;
            background: linear-gradient(rgba(255, 255, 255, 0.72), transparent);
        }

        .lyrics-panel::after {
            bottom: 0;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.72));
        }

        .lyrics-lines {
            height: 7.5em;
            padding: 22px 0;
            overflow-y: auto;
            scrollbar-width: none;
            position: relative;
            z-index: 0;
        }

        .lyrics-lines::-webkit-scrollbar {
            width: 0;
        }

        .lyrics-line {
            height: var(--lyrics-line-height, 1.8em);
            overflow: hidden;
            color: #77717e;
            font-size: 14px;
            line-height: var(--lyrics-line-height, 1.8em);
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lyrics-spacer {
            height: var(--lyrics-line-height, 1.8em);
            pointer-events: none;
        }

        .lyrics-line.active {
            color: #775c9e;
            font-size: 1.25em;
            font-weight: 600;
            line-height: 1.25;
        }

        .lyrics-message {
            color: #99929f;
            font-size: 13px;
            line-height: 7.5em;
            text-align: center;
        }

        .lyrics-controls {
            grid-column: 1;
            grid-row: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-width: 0;
            margin-top: 8px;
            position: relative;
            z-index: 2;
        }

        .lyrics-panel.maximized .lyrics-controls {
            position: absolute;
            top: -30px;
            right: 32px;
            left: 48px;
            width: auto;
            margin-top: 0;
        }

        .lyrics-play,
        .lyrics-offset {
            border: 1px solid #e3dfe7;
            border-radius: 7px;
            background: #faf9fb;
            color: #59535f;
            cursor: pointer;
            font-size: 12px;
        }

        .lyrics-play {
            width: 32px;
            height: 30px;
        }

        .lyrics-search {
            width: 32px;
            height: 30px;
        }

        .lyrics-offset {
            flex: 1 1 0;
            width: 0;
            min-width: 0;
            accent-color: #8d72b8;
        }

        .lyrics-timeline {
            grid-column: 2;
            grid-row: 1 / 4;
            width: 16px;
            height: 100%;
            min-height: 80px;
            margin: 0;
            justify-self: end;
            position: relative;
            z-index: 2;
            accent-color: #8d72b8;
            writing-mode: vertical-lr;
            direction: ltr;
        }

        .lyrics-time {
            width: auto;
            min-width: 58px;
            margin-left: 2px;
            color: #77717e;
            font-size: 10px;
            text-align: left;
            white-space: nowrap;
        }

        @container (max-width: 420px) {
            .lyrics-line {
                font-size: 12px;
            }
        }

        @container (min-width: 600px) {
            .lyrics-line {
                font-size: 16px;
            }
        }

        @media (max-width: 600px) {
            .lyrics-panel.maximized .lyrics-lines {
                position: relative;
                left: 0;
                width: 100%;
            }
        }

        .lyrics-offset-label {
            min-width: 48px;
            flex: 0 0 48px;
            color: #77717e;
            font-size: 10px;
            text-align: right;
            white-space: nowrap;
        }

        .lyrics-search-results {
            display: grid;
            align-content: start;
            grid-auto-rows: max-content;
            gap: 6px;
            height: 100%;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .lyrics-search-results::-webkit-scrollbar {
            width: 0;
        }

        .lyrics-search-result {
            width: 100%;
            overflow: hidden;
            padding: 7px 9px;
            border: 1px solid #e3dfe7;
            border-radius: 7px;
            background: rgba(255, 255, 255, 0.62);
            color: #59535f;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lyrics-search-result:hover {
            background: #eee8f7;
        }

        .lyrics-panel.maximized .lyrics-offset {
            grid-column: 1;
            grid-row: 3;
        }

        .lyrics-panel.maximized .lyrics-offset-label {
            grid-column: 1;
            grid-row: 3;
        }

        .lyrics-offset-controls {
            grid-column: 1;
            grid-row: 3;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            margin-top: 7px;
        }

        .user {
            color: #68616f;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* =========================
           Status
           ========================= */

        .status-container {
            position: relative;

            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            min-width: 0;
        }

        .status-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            flex: 1 1 auto;
            min-width: 0;

            padding: 7px 10px;

            border: 1px solid #e4dfe8;
            border-radius: 8px;

            background: #faf9fb;

            color: #59535f;

            cursor: pointer;

            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
        }

        .status-button::after {
            content: "▼";

            margin-left: auto;

            font-size: 9px;
            color: #99929f;
        }

        .status-button.queued {
            background: #f1ebf9;
            border-color: #e1d5ef;
            color: #775c9e;
        }

        .status-button.completed {
            background: #eaf6ef;
            border-color: #d5eadf;
            color: #4d8968;
        }

        .status-button.cancelled {
            background: #fbecee;
            border-color: #efd8dc;
            color: #ae626d;
        }

        /* =========================
           Dropdown
           ========================= */

        .status-menu {
            position: absolute;

            top: auto;
            bottom: calc(100% + 5px);
            left: 0;

            z-index: 100;

            width: 120px;

            padding: 5px;

            border: 1px solid #e5e0e8;
            border-radius: 9px;

            background: white;

            box-shadow:
                0 8px 25px rgba(40, 30, 50, 0.10);

            display: none;
        }

        .status-menu.open {
            display: block;
            position: fixed;
            bottom: auto;
            z-index: 1000;
        }

        .status-option {
            width: 100%;

            padding: 8px 10px;

            border: none;
            border-radius: 6px;

            background: transparent;

            text-align: left;

            cursor: pointer;

            font-size: 13px;
        }

        .status-option:hover {
            background: #f5f2f7;
        }

        /* =========================
           Update Button
           ========================= */

        .update-button {
            padding: 7px 11px;

            border: none;
            border-radius: 8px;

            background: #8d72b8;
            color: white;

            cursor: pointer;

            font-size: 13px;

            display: none;
        }

        .update-button:hover {
            background: #795ea5;
        }

        .update-button.visible {
            display: inline-block;
        }

        .update-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .cancel-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            margin-left: 0;
            border: 1px solid #efd8dc;
            border-radius: 8px;
            background: #fbecee;
            color: #ae626d;
            cursor: pointer;
        }

        .cancel-button:hover {
            background: #f5dce0;
        }

        .cancel-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* =========================
           Empty / Loading / Error
           ========================= */

        .message {
            padding: 50px 20px;

            text-align: center;

            color: #99929f;

            font-size: 14px;
        }

        .error {
            color: #b55e69;
        }

        /* =========================
           Mobile
           ========================= */

        @media (max-width: 600px) {
            .container {
                flex: 1 1 auto;
                width: calc(100% - 20px);
                min-height: 0;
                margin: 20px auto 8px;
            }

            .header {
                align-items: flex-start;
            }

            .title h1 {
                font-size: 19px;
            }

            .refresh-button {
                width: 38px;
                height: 38px;
                padding: 0;
                font-size: 0;
            }

            .refresh-button::before {
                content: "↻";
                font-size: 18px;
            }

            .filter-button {
                width: 32px;
                height: 32px;
                min-width: 32px;
                min-height: 32px;
                flex: 0 0 32px;
                padding: 0;
                justify-content: center;
                border-color: transparent;
                border-radius: 7px;
                background: transparent;
                color: #625d68;
                font-size: 0;
            }

            .filter-button i {
                font-size: 16px;
            }

            .filter-button:hover,
            .filter-button:focus-visible {
                background: rgba(141, 114, 184, 0.12);
                border-color: transparent;
            }

            .status-container {
                gap: 4px;
            }

            .status-button {
                position: relative;
                flex: 0 0 34px;
                width: 34px;
                padding: 7px 0;
                justify-content: center;
                border-color: transparent !important;
                background: transparent !important;
                font-size: 0;
            }

            .status-button::before {
                position: absolute;
                top: 50%;
                left: 50%;
                font-size: 13px;
                line-height: 1;
                transform: translate(-50%, -50%);
            }

            .status-button.queued::before {
                content: "🟣";
            }

            .status-button.completed::before {
                content: "🟢";
            }

            .status-button.cancelled::before {
                content: "🔴";
            }

            .status-button::after {
                content: none;
            }

            .status-option {
                width: 34px;
                padding: 8px;
                text-align: center;
                font-size: 0;
            }

            .status-menu {
                width: 82px;
                white-space: nowrap;
            }

            .lyrics-row td {
                padding-left: 7px;
                padding-right: 7px;
            }

            .status-option::before {
                font-size: 13px;
            }

            .status-option[data-status="queued"]::before {
                content: "🟣";
            }

            .status-option[data-status="completed"]::before {
                content: "🟢";
            }

            .status-option[data-status="cancelled"]::before {
                content: "🔴";
            }

            .cancel-button {
                flex-basis: 34px;
            }

            .table-wrapper {
                overflow-x: hidden;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }

            .table-wrapper::-webkit-scrollbar {
                display: none;
            }

            table {
                table-layout: fixed;
            }

            th:nth-child(1),
            td:nth-child(1) {
                width: 6%;
            }

            th:nth-child(2),
            td:nth-child(2) {
                width: 42%;
                max-width: 42%;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            th:nth-child(3),
            td:nth-child(3) {
                width: 20%;
                max-width: 20%;
                padding-left: 4px;
                padding-right: 4px;
                text-align: left;
                font-size: 15px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            th:nth-child(4),
            td:nth-child(4) {
                width: 26%;
                max-width: 26%;
            }

            th,
            td {
                padding: 7px;
            }
        }

        @media (max-width: 380px) {
            .cancel-button {
                transform: translateX(-4px);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         Header
         ========================= -->

    <header class="header">

        <div class="title">

            <div class="title-icon">
                🎵
            </div>

            <div>
                <h1>今日點歌</h1>

                <div
                    class="count"
                    id="orderCount"
                >
                    載入中...
                </div>
            </div>

        </div>

        <div class="filter-container">
            <button
                type="button"
                class="filter-button"
                id="filterButton"
                aria-expanded="false"
            >
                <i class="fa-solid fa-filter"></i>
                篩選

<script>

/* =========================================================
   API
   ========================================================= */

const API_URL =
    "https://song-list.shiroshio0507.workers.dev/api/songlist";

const LRCLIB_API_URL =
    "https://lrclib.net/api/get";

const LRCLIB_SEARCH_API_URL =
    "https://lrclib.net/api/search";


/* =========================================================
   狀態設定
   ========================================================= */

const STATUS = {

    queued: {
        label: "排隊中",
        className: "queued",
        icon: "🟣"
    },

    completed: {
        label: "完成",
        className: "completed",
        icon: "🟢"
    },

    cancelled: {
        label: "取消",
        className: "cancelled",
        icon: "🔴"
    }

};


/* =========================================================
   DOM
   ========================================================= */

const orderList =
    document.getElementById("orderList");

const orderCount =
    document.getElementById("orderCount");

const refreshButton =
    document.getElementById("refreshButton");

const filterButton =
    document.getElementById("filterButton");

const filterMenu =
    document.getElementById("filterMenu");

const filterCheckboxes =
    filterMenu.querySelectorAll("input[data-hidden-status]");

const HIDDEN_STATUS_STORAGE_KEY =
    "songlist-hidden-statuses";

let allOrders = [];
let hiddenStatuses = new Set();

try {
    const savedStatuses = JSON.parse(
        localStorage.getItem(HIDDEN_STATUS_STORAGE_KEY) || "[]"
    );

    hiddenStatuses = new Set(
        savedStatuses.filter(status => STATUS[status])
    );
} catch (error) {
    console.warn("讀取篩選條件失敗:", error);
}

filterCheckboxes.forEach(checkbox => {
    checkbox.checked = hiddenStatuses.has(
        checkbox.dataset.hiddenStatus
    );

    checkbox.addEventListener("change", () => {
        const status = checkbox.dataset.hiddenStatus;

        if (checkbox.checked) {
            hiddenStatuses.add(status);
        } else {
            hiddenStatuses.delete(status);
        }

        saveHiddenStatuses();
        renderOrders(allOrders);
    });
});

function saveHiddenStatuses() {
    localStorage.setItem(
        HIDDEN_STATUS_STORAGE_KEY,
        JSON.stringify([...hiddenStatuses])
    );
}

async function copyTextToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
    }

    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.setAttribute("readonly", "");
    textArea.style.position = "fixed";
    textArea.style.top = "-9999px";
    textArea.style.left = "-9999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    try {
        document.execCommand("copy");
    } finally {
        document.body.removeChild(textArea);
    }
}

filterButton.addEventListener("click", event => {
    event.stopPropagation();
    filterMenu.classList.toggle("open");
    filterButton.setAttribute(
        "aria-expanded",
        filterMenu.classList.contains("open")
    );
});


/* =========================================================
   載入今日點歌
   ========================================================= */

const AUTO_REFRESH_INTERVAL = 60 * 1000; // 1 分鐘

let refreshTimer = null;
let isLoading = false;

async function loadOrders() {

    // 防止手動刷新與自動刷新同時發送請求
    if (isLoading) {
        return;
    }

    isLoading = true;

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error("API 回傳 success=false");
        }

        const orders =
            Array.isArray(data.orders)
                ? data.orders
                : [];

        allOrders = orders;

        if (!document.querySelector(".table-wrapper.lyrics-mode")) {
            renderOrders(allOrders);
        }

    } catch (error) {

        console.error(
            "取得點歌資料失敗:",
            error
        );

        /*
         * 注意：
         * 自動刷新失敗時不要清掉目前畫面。
         * 保留使用者目前看到的資料。
         */

    } finally {

        isLoading = false;

        scheduleAutoRefresh();
    }
}

function scheduleAutoRefresh() {

    // 清除上一個計時器
    if (refreshTimer) {
        clearTimeout(refreshTimer);
    }

    refreshTimer = setTimeout(() => {

        loadOrders();

    }, AUTO_REFRESH_INTERVAL);
}

/* =========================================================
   Render
   ========================================================= */

function renderOrders(orders) {

    orders.sort(
        (a, b) =>
            new Date(a.created_at) -
            new Date(b.created_at)
    );

    const visibleOrders = orders.filter(order =>
        !hiddenStatuses.has(order.status)
    );

    orderCount.textContent =
        hiddenStatuses.size === 0
            ? `${orders.length} 首`
            : `${visibleOrders.length} / ${orders.length} 首`;


    if (visibleOrders.length === 0) {

        orderList.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="message"
                >
                    ${orders.length === 0
                        ? "今天還沒有點歌"
                        : "沒有符合篩選的點歌"}
                </td>
            </tr>
        `;

        return;
    }


    orderList.innerHTML =
        visibleOrders
            .map((order, index) =>
                createOrderRow(
                    order,
                    index
                )
            )
            .join("");


    /*
     * 綁定狀態按鈕
     */

    bindStatusEvents();

}


/* =========================================================
   建立單筆資料
   ========================================================= */

function createOrderRow(order, index) {
    const displayUser =
        order.user_name === "anonymous"
            ? "匿名"
            : (order.user_name || "匿名");

    const status =
        String(order.status || "").trim();

    const statusInfo =
        STATUS[status];

    if (!statusInfo) {

        console.error(
            "未知的 status:",
            order.status,
            order
        );

        return "";
    }


    return `
        <tr class="lyrics-row" hidden>
            <td colspan="4">
                <div class="lyrics-panel" data-lyrics-panel>
                    <button
                        type="button"
                        class="lyrics-back"
                        data-action="lyrics-back"
                        aria-label="返回點歌單"
                        title="返回點歌單"
                    >
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>

                    <div class="lyrics-lines" data-lyrics-lines>
                        <div class="lyrics-message">點擊左側音符載入歌詞</div>
                    </div>

                    <div class="lyrics-controls">
                        <button
                            type="button"
                            class="lyrics-play"
                            data-action="lyrics-play"
                            aria-label="播放"
                            title="播放"
                            disabled
                        >
                            <i class="fa-solid fa-play"></i>
                        </button>

                        <span class="lyrics-time" data-lyrics-time>
                            0:00 / 0:00
                        </span>

                        <button
                            type="button"
                            class="lyrics-search"
                            data-action="lyrics-search"
                            aria-label="搜尋其他歌詞"
                            title="搜尋其他歌詞"
                        >
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </div>

                    <div class="lyrics-offset-controls">
                        <input
                            class="lyrics-offset"
                            data-action="lyrics-offset"
                            type="range"
                            min="-5"
                            max="5"
                            step="0.1"
                            value="0"
                            aria-label="時間軸偏移"
                            title="時間軸偏移"
                            disabled
                        >

                        <span class="lyrics-offset-label" data-lyrics-offset-label>
                            偏移 0.0s
                        </span>
                    </div>

                    <input
                        class="lyrics-timeline"
                        data-action="lyrics-timeline"
                        type="range"
                        min="0"
                        max="0"
                        step="0.1"
                        value="0"
                        aria-label="歌詞時間軸"
                        title="歌詞時間軸"
                        disabled
                    >

                </div>
            </td>
        </tr>

        <tr
            data-id="${escapeHtml(order.id)}"
            data-song-name="${escapeHtml(order.song_name)}"
            data-artist="${escapeHtml(order.artist)}"
            data-user="${escapeHtml(order.user_name || "")}"
        >

            <td class="index">
                #${index + 1}
            </td>

            <td class="song">
                <div class="song-content">
                    <button
                        type="button"
                        class="lyrics-toggle"
                        data-action="lyrics-toggle"
                        aria-expanded="false"
                        aria-label="展開歌詞"
                        title="展開歌詞"
                    >
                        <i class="fa-solid fa-music"></i>
                    </button>

                    <span
                        class="song-copy"
                        data-action="copy-song"
                        data-song-name="${escapeHtml(order.song_name)}"
                        title="點擊複製歌名"
                    >
                        <span class="song-title">
                            ${escapeHtml(order.song_name)}
                        </span>
                        <span class="song-artist">
                            ${escapeHtml(order.artist)}
                        </span>
                    </span>
                </div>
            </td>

            <td class="user">
                ${escapeHtml(displayUser)}
            </td>

            <td>

                <div
                    class="status-container"
                    data-status="${status}"
                >

                    <button
                        type="button"
                        class="status-button ${statusInfo.className}"
                        data-action="toggle"
                    >
                        ${statusInfo.icon}
                        ${statusInfo.label}
                    </button>


                    <div class="status-menu">

                        ${Object.entries(STATUS)
                            .filter(([key]) => key !== "cancelled")
                            .map(([key, value]) => `
                                <button
                                    type="button"
                                    class="status-option"
                                    data-status="${key}"
                                >
                                    ${value.icon}
                                    ${value.label}
                                </button>
                            `)
                            .join("")}

                    </div>


                    <button
                        type="button"
                        class="update-button"
                        data-action="update"
                    >
                        更新
                    </button>

                    <button
                        type="button"
                        class="cancel-button"
                        data-action="cancel"
                        aria-label="取消點歌"
                        title="取消點歌"
                        ${status === "cancelled" ? "disabled" : ""}
                    >
                        <i class="fa-solid fa-trash-can"></i>
                    </button>

                </div>

            </td>

        </tr>

    `;
}


/* =========================================================
   狀態 UI 事件
   ========================================================= */

const lyricsStates = new WeakMap();

function parseSyncedLyrics(lyrics) {
    const lines = [];
    const linePattern = /\[(\d+):(\d{2})(?:[.:](\d{1,3}))?\]\s*(.*)/g;
    let match;

    while ((match = linePattern.exec(lyrics)) !== null) {
        const fraction = match[3] || "0";
        const milliseconds = fraction.length === 1
            ? Number(fraction) * 100
            : fraction.length === 2
                ? Number(fraction) * 10
                : Number(fraction);

        const text = match[4]
            .replace(/\[\d+:\d{2}(?:[.:]\d{1,3})?\]/g, "")
            .trim();

        if (!text) {
            continue;
        }

        lines.push({
            time: Number(match[1]) * 60 + Number(match[2]) + milliseconds / 1000,
            text
        });
    }

    return lines.sort((a, b) => a.time - b.time);
}

function findActiveLyricIndex(lines, currentTime) {
    let activeIndex = -1;

    lines.forEach((line, index) => {
        if (line.time <= currentTime) {
            activeIndex = index;
        }
    });

    return activeIndex;
}

function renderLyrics(panel, state) {
    const linesElement = panel.querySelector("[data-lyrics-lines]");
    const offsetLabel = panel.querySelector("[data-lyrics-offset-label]");
    const timeline = panel.querySelector("[data-action=\"lyrics-timeline\"]");
    const timeLabel = panel.querySelector("[data-lyrics-time]");
    const activeIndex = findActiveLyricIndex(state.lines, state.currentTime + state.offset);
    const lineStyles = getComputedStyle(linesElement);
    const lineHeight = parseFloat(lineStyles.lineHeight) || 25;
    linesElement.style.setProperty("--lyrics-line-height", `${lineHeight}px`);
    const verticalPadding =
        parseFloat(lineStyles.paddingTop) +
        parseFloat(lineStyles.paddingBottom);
    const visibleCount = Math.max(
        1,
        Math.floor((linesElement.clientHeight - verticalPadding) / lineHeight)
    );
    const effectiveActiveIndex = activeIndex < 0 ? 0 : activeIndex;
    const centerIndex = Math.floor(visibleCount / 2);
    const firstIndex = Math.max(
        0,
        effectiveActiveIndex - centerIndex
    );
    const topSpacerCount = Math.max(
        0,
        centerIndex - effectiveActiveIndex + firstIndex
    );
    const lineCapacity = Math.max(1, visibleCount - topSpacerCount);
    const visibleLines = state.lines.slice(
        firstIndex,
        firstIndex + lineCapacity
    );
    const activeVisibleIndex = effectiveActiveIndex - firstIndex;
    const bottomSpacerCount = Math.max(
        0,
        visibleCount - topSpacerCount - visibleLines.length
    );

    linesElement.innerHTML = [
        ...Array.from({ length: topSpacerCount }, () => '<div class="lyrics-spacer"></div>'),
        ...visibleLines.map((line, index) => `
            <div class="lyrics-line ${firstIndex + index === effectiveActiveIndex ? "active" : ""}">
                ${escapeHtml(line.text || " ")}
            </div>
        `),
        ...Array.from({ length: bottomSpacerCount }, () => '<div class="lyrics-spacer"></div>')
    ].join("");

    offsetLabel.textContent = `偏移 ${state.offset >= 0 ? "+" : ""}${state.offset.toFixed(1)}s`;
    timeline.value = String(state.currentTime);
    timeLabel.textContent = `${formatLyricsTime(state.currentTime)} / ${formatLyricsTime(state.duration)}`;
}

function formatLyricsTime(seconds) {
    const safeSeconds = Math.max(0, Number(seconds) || 0);
    const minutes = Math.floor(safeSeconds / 60);
    const remainingSeconds = Math.floor(safeSeconds % 60);

    return `${minutes}:${String(remainingSeconds).padStart(2, "0")}`;
}

function setLyricsMessage(panel, message) {
    panel.querySelector("[data-lyrics-lines]").innerHTML =
        `<div class="lyrics-message">${escapeHtml(message)}</div>`;
}

function updateLyricsPlayback(panel, state) {
    if (!state.playing) {
        return;
    }

    state.currentTime = (Date.now() - state.startedAt) / 1000;
    if (state.currentTime >= state.duration) {
        state.currentTime = state.duration;
        pauseLyricsPlayback(panel, state);
    }
    renderLyrics(panel, state);
}

function startLyricsPlayback(panel, state) {
    state.playing = true;
    state.startedAt = Date.now() - state.currentTime * 1000;
    state.timer = setInterval(
        () => updateLyricsPlayback(panel, state),
        100
    );
    panel.querySelector("[data-action=\"lyrics-play\"]").innerHTML =
        '<i class="fa-solid fa-pause"></i>';
    panel.querySelector("[data-action=\"lyrics-play\"]").setAttribute("aria-label", "暫停");
}

function pauseLyricsPlayback(panel, state) {
    state.playing = false;
    clearInterval(state.timer);
    state.timer = null;
    panel.querySelector("[data-action=\"lyrics-play\"]").innerHTML =
        '<i class="fa-solid fa-play"></i>';
    panel.querySelector("[data-action=\"lyrics-play\"]").setAttribute("aria-label", "播放");
}

function applyLyricsData(panel, state, data) {
    state.duration = Number(data.duration) || 0;
    state.lines = parseSyncedLyrics(data.syncedLyrics || "");

    if (state.lines.length === 0 && data.plainLyrics) {
        state.lines = data.plainLyrics
            .split(/\r?\n/)
            .map(text => ({ time: 0, text: text.trim() }))
            .filter(line => line.text);
    }

    if (state.lines.length === 0) {
        throw new Error(data.instrumental ? "這首歌是純音樂" : "沒有可顯示的歌詞");
    }

    state.currentTime = 0;
    state.loaded = true;
    panel.querySelector("[data-action=\"lyrics-play\"]").disabled = false;
    panel.querySelector("[data-action=\"lyrics-offset\"]").disabled = false;
    const timeline = panel.querySelector("[data-action=\"lyrics-timeline\"]");
    timeline.max = String(Math.max(state.duration, state.lines.at(-1)?.time || 0));
    timeline.disabled = false;
    renderLyrics(panel, state);
}

function renderLyricsSearchResults(panel, results) {
    const linesElement = panel.querySelector("[data-lyrics-lines]");
    linesElement.innerHTML = `
        <div class="lyrics-search-results">
            ${results.map((result, index) => `
                <button
                    type="button"
                    class="lyrics-search-result"
                    data-search-index="${index}"
                    title="${escapeHtml(result.artistName || "未知歌手")} - ${escapeHtml(result.trackName || result.name || "未知歌名") }"
                >
                    ${escapeHtml(result.artistName || "未知歌手")} - ${escapeHtml(result.trackName || result.name || "未知歌名")}
                </button>
            `).join("")}
        </div>
    `;

    linesElement
        .querySelectorAll("[data-search-index]")
        .forEach(button => {
            button.addEventListener("click", () => {
                const state = lyricsStates.get(panel);
                const result = results[Number(button.dataset.searchIndex)];

                try {
                    applyLyricsData(panel, state, result);
                } catch (error) {
                    setLyricsMessage(panel, error.message);
                }
            });
        });
}

async function searchLyrics(row, panel) {
    setLyricsMessage(panel, "搜尋其他歌詞...");

    try {
        const query = new URLSearchParams({
            q: row.dataset.artist,
            track_name: row.dataset.songName
        });
        const response = await fetch(`${LRCLIB_SEARCH_API_URL}?${query}`, {
            headers: {
                "Accept": "application/json",
                "X-User-Agent": "SongList (local HTML client)"
            }
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const results = await response.json();
        if (!Array.isArray(results) || results.length === 0) {
            throw new Error("找不到其他歌詞");
        }

        renderLyricsSearchResults(panel, results);
    } catch (error) {
        setLyricsMessage(panel, error.message || "搜尋歌詞失敗");
    }
}

async function loadLyrics(row, panel) {
    const state = {
        lines: [],
        currentTime: 0,
        offset: 0,
        duration: 0,
        playing: false,
        timer: null,
        loaded: false
    };

    lyricsStates.set(panel, state);
    setLyricsMessage(panel, "歌詞載入中...");

    try {
        const query = new URLSearchParams({
            artist_name: row.dataset.artist,
            track_name: row.dataset.songName
        });
        const response = await fetch(`${LRCLIB_API_URL}?${query}`, {
            headers: {
                "Accept": "application/json",
                "X-User-Agent": "SongList (local HTML client)"
            }
        });

        if (!response.ok) {
            throw new Error(response.status === 404 ? "找不到歌詞" : `HTTP ${response.status}`);
        }

        applyLyricsData(panel, state, await response.json());
    } catch (error) {
        setLyricsMessage(panel, error.message || "歌詞載入失敗");
    }
}

function positionLyricsOverlay(songRow, lyricsRow) {
    const wrapper = songRow.closest(".table-wrapper");
    const overlayWidth = wrapper.clientWidth - 16;
    const overlayHeight = wrapper.clientHeight - 16;
    const cell = lyricsRow.querySelector("td");
    const panel = lyricsRow.querySelector("[data-lyrics-panel]");
    const left = wrapper.scrollLeft;
    const top = wrapper.scrollTop + 8;

    wrapper.classList.add("lyrics-mode");
    lyricsRow.style.left = `${left}px`;
    lyricsRow.style.top = `${top}px`;
    lyricsRow.style.width = `${overlayWidth}px`;
    panel.classList.add("maximized");
    panel.style.height = `${overlayHeight}px`;
    cell.style.width = `${overlayWidth}px`;
    panel.style.width = `${overlayWidth}px`;
}

function closeLyricsOverlay(lyricsRow, panel) {
    lyricsRow.hidden = true;
    lyricsRow.style.left = "";
    lyricsRow.style.top = "";
    lyricsRow.style.width = "";
    lyricsRow.querySelector("td").style.width = "";
    panel.style.width = "";

    const songRow = lyricsRow.nextElementSibling;
    songRow.hidden = false;
    lyricsRow.closest(".table-wrapper").classList.remove("lyrics-mode");
    panel.classList.remove("maximized");
    panel.style.height = "";
    songRow
        .querySelector('[data-action="lyrics-toggle"]')
        .setAttribute("aria-expanded", "false");

    const state = lyricsStates.get(panel);
    if (state) {
        pauseLyricsPlayback(panel, state);
    }

    renderOrders(allOrders);
}

function repositionOpenLyricsOverlay() {
    const lyricsRow = document.querySelector(".lyrics-row:not([hidden])");

    if (!lyricsRow) {
        return;
    }

    const songRow = lyricsRow.nextElementSibling;
    positionLyricsOverlay(songRow, lyricsRow);
}

window.addEventListener("resize", repositionOpenLyricsOverlay);

function bindStatusEvents() {

    document
        .querySelectorAll('[data-action="lyrics-toggle"]')
        .forEach(button => {
            button.addEventListener("click", async event => {
                event.stopPropagation();

                const row = button.closest("tr");
                const lyricsRow = row.previousElementSibling;
                const panel = lyricsRow.querySelector("[data-lyrics-panel]");
                const isOpen = !lyricsRow.hidden;

                if (isOpen) {
                    closeLyricsOverlay(lyricsRow, panel);
                    return;
                }

                lyricsRow.hidden = false;
                button.setAttribute("aria-expanded", String(!isOpen));

                positionLyricsOverlay(row, lyricsRow);
                row.hidden = true;

                if (!lyricsStates.has(panel)) {
                    await loadLyrics(row, panel);
                }
            });
        });

    document
        .querySelectorAll('[data-action="lyrics-back"]')
        .forEach(button => {
            button.addEventListener("click", event => {
                event.stopPropagation();

                const panel = button.closest("[data-lyrics-panel]");
                closeLyricsOverlay(panel.closest(".lyrics-row"), panel);
            });
        });

    document
        .querySelectorAll('[data-action="lyrics-play"]')
        .forEach(button => {
            button.addEventListener("click", event => {
                event.stopPropagation();

                const panel = button.closest("[data-lyrics-panel]");
                const state = lyricsStates.get(panel);

                if (!state || !state.loaded) {
                    return;
                }

                if (state.playing) {
                    pauseLyricsPlayback(panel, state);
                } else {
                    startLyricsPlayback(panel, state);
                }
            });
        });

    document
        .querySelectorAll('[data-action="lyrics-search"]')
        .forEach(button => {
            button.addEventListener("click", event => {
                event.stopPropagation();

                const panel = button.closest("[data-lyrics-panel]");
                const row = panel.closest(".lyrics-row").nextElementSibling;
                searchLyrics(row, panel);
            });
        });

    document
        .querySelectorAll('[data-action="lyrics-offset"]')
        .forEach(input => {
            input.addEventListener("input", event => {
                const panel = input.closest("[data-lyrics-panel]");
                const state = lyricsStates.get(panel);

                if (!state) {
                    return;
                }

                state.offset = Number(event.target.value);
                renderLyrics(panel, state);
            });
        });

    document
        .querySelectorAll('[data-action="lyrics-timeline"]')
        .forEach(input => {
            input.addEventListener("input", event => {
                const panel = input.closest("[data-lyrics-panel]");
                const state = lyricsStates.get(panel);

                if (!state) {
                    return;
                }

                state.currentTime = Number(event.target.value);
                if (state.playing) {
                    state.startedAt = Date.now() - state.currentTime * 1000;
                }
                renderLyrics(panel, state);
            });
        });

    document
        .querySelectorAll(
            '[data-action="copy-song"]'
        )
        .forEach(song => {

            song.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();

                    try {
                        await copyTextToClipboard(
                            song.dataset.songName
                        );
                    } catch (error) {
                        console.error(
                            "複製歌名失敗:",
                            error
                        );
                    }

                }
            );

        });

    /*
     * 開關下拉選單
     */

    document
        .querySelectorAll(
            '[data-action="toggle"]'
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    const container =
                        button.closest(
                            ".status-container"
                        );

                    closeAllMenus(
                        container
                    );

                    const menu = container.querySelector(
                        ".status-menu"
                    );

                    menu.classList.toggle("open");

                    if (menu.classList.contains("open")) {
                        const buttonRect = button.getBoundingClientRect();
                        const menuWidth = menu.offsetWidth;
                        const menuHeight = menu.offsetHeight;
                        const menuLeft = Math.max(
                            8,
                            Math.min(
                                buttonRect.left,
                                window.innerWidth - menuWidth - 8
                            )
                        );
                        const menuTop = Math.max(
                            8,
                            buttonRect.top - menuHeight - 5
                        );

                        menu.style.left = `${menuLeft}px`;
                        menu.style.top = `${menuTop}px`;
                    } else {
                        menu.style.left = "";
                        menu.style.top = "";
                    }

                }
            );

        });


    /*
     * 選擇狀態
     */

    document
        .querySelectorAll(
            ".status-option"
        )
        .forEach(option => {

            option.addEventListener(
                "click",
                () => {

                    const container =
                        option.closest(
                            ".status-container"
                        );

                    const newStatus =
                        option.dataset.status;


                    /*
                     * 取得目前狀態
                     */

                    const oldStatus =
                        container.dataset.status;


                    /*

                        const statusButton = container.querySelector(
                            ".status-button"
                        );

                        statusButton.className =
                            `status-button ${STATUS[newStatus].className}`;

                        statusButton.innerHTML =
                            `${STATUS[newStatus].icon}
                             ${STATUS[newStatus].label}`;
                     * 如果沒有改變，
                     * 不顯示更新按鈕。
                     */

                    if (
                        newStatus === oldStatus
                    ) {

                        container
                            .querySelector(
                                ".status-menu"
                            )
                            .classList.remove(
                                "open"
                            );

                        return;

                    }


                    /*
                     * 暫存新狀態
                     *
                     * 注意：
                     * 這裡還沒有 PATCH。
                     */

                    container.dataset.pendingStatus =
                        newStatus;


                    const button =
                        container.querySelector(
                            ".status-button"
                        );


                    button.className =
                        `status-button ${STATUS[newStatus].className}`;

                    button.innerHTML =
                        `${STATUS[newStatus].icon}
                         ${STATUS[newStatus].label}`;


                    /*
                     * 顯示更新按鈕
                     */

                    container
                        .querySelector(
                            ".update-button"
                        )
                        .classList.add(
                            "visible"
                        );


                    container
                        .querySelector(
                            ".status-menu"
                        )
                        .classList.remove(
                            "open"
                        );

                }
            );

        });


    /*
     * PATCH 更新
     */

    document
        .querySelectorAll(
            '[data-action="update"]'
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    updateOrderStatus(
                        button
                    );

                }
            );

        });

    document
        .querySelectorAll(
            '[data-action="cancel"]'
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    updateOrderStatus(
                        button,
                        "cancelled"
                    );

                }
            );

        });

}


/* =========================================================
   更新狀態
   ========================================================= */

async function updateOrderStatus(updateButton, forcedStatus = null) {

    const container =
        updateButton.closest(".status-container");

    const row =
        updateButton.closest("tr");

    // ==========================================
    // 從目前這一列取得資料
    // ==========================================

    const id =
        row.dataset.id;

    const newStatus =
        forcedStatus || container.dataset.pendingStatus;

    // 歌手 - 歌名那一欄
    // 注意：Worker 只需要 song_name
    const songName =
        row.dataset.songName;

    // 點歌人
    const user =
        row.dataset.user;


    if (!newStatus) {
        return;
    }


    // ==========================================
    // 防止重複點擊
    // ==========================================

    updateButton.disabled = true;
    if (updateButton.dataset.action === "update") {
        updateButton.textContent = "更新中...";
    }


    try {

        const response = await fetch(
            `https://song-list.shiroshio0507.workers.dev/api/order/${encodeURIComponent(id)}`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: newStatus,

                    // 必須與 D1 完全一致
                    songName: songName,

                    // 必須與 D1 完全一致
                    user: user
                })
            }
        );


        const data = await response.json();


        // ==========================================
        // Worker 回傳錯誤
        // ==========================================

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                `HTTP ${response.status}`
            );

        }


        // ==========================================
        // 更新成功
        // ==========================================

        container.dataset.status =
            newStatus;

        delete container.dataset.pendingStatus;


        const pendingUpdateButton = container.querySelector(
            '[data-action="update"]'
        );

        pendingUpdateButton
            .classList
            .remove("visible");

        updateButton.disabled = false;
        if (updateButton.dataset.action === "update") {
            updateButton.textContent = "更新";
        }

        if (newStatus === "cancelled") {
            container.querySelector('[data-action="cancel"]').disabled = true;
        }


        console.log(
            `訂單 #${id} 狀態更新成功`
        );

        await loadOrders();


    } catch (error) {

        console.error(
            "更新點歌狀態失敗:",
            error
        );


        updateButton.disabled = false;
        updateButton.textContent = "更新";


        /*
         * 重新抓 API
         *
         * 讓畫面恢復成 D1 真正的狀態。
         */

        await loadOrders();


        alert(
            `狀態更新失敗\n${error.message}`
        );
    }
}

/* =========================================================
   關閉所有下拉選單
   ========================================================= */

function closeAllMenus(
    except = null
) {

    document
        .querySelectorAll(
            ".status-menu.open"
        )
        .forEach(menu => {

            const container =
                menu.closest(
                    ".status-container"
                );

            if (
                container !== except
            ) {

                menu.classList.remove(
                    "open"
                );
                menu.style.left = "";
                menu.style.top = "";

            }

        });

}


/* =========================================================
   點擊其他地方 → 關閉選單
   ========================================================= */

document.addEventListener(
    "click",
    () => {

        closeAllMenus();
        filterMenu.classList.remove("open");
        filterButton.setAttribute("aria-expanded", "false");

    }
);


/* =========================================================
   重新整理
   ========================================================= */

refreshButton.addEventListener(
    "click",
    async () => {
        await loadOrders();
    }
);


/* =========================================================
   HTML Escape
   防止 API 資料直接注入 HTML
   ========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   初始化
   ========================================================= */

loadOrders();
