<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>今日點歌</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f7;
            color: #29262f;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                sans-serif;
        }

        .container {
            width: min(1000px, calc(100% - 32px));
            margin: 40px auto;
        }

        /* =========================
           Header
           ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;
            background: #eee8f7;

            font-size: 20px;
        }

        .title h1 {
            margin: 0;
            font-size: 22px;
        }

        .count {
            margin-top: 3px;
            color: #918c98;
            font-size: 13px;
        }

        /* =========================
           Header 操作區
           ========================= */

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* =========================
           篩選按鈕
           ========================= */

        .filter-wrapper {
            position: relative;
        }

        .filter-button {
            display: flex;
            align-items: center;
            gap: 6px;

            border: 1px solid #e3dfe7;
            background: white;

            padding: 9px 13px;
            border-radius: 9px;

            color: #625d68;
            cursor: pointer;

            transition: 0.15s;
        }

        .filter-button:hover {
            background: #f8f7fa;
        }

        .filter-button.active {
            background: #eee8f7;
            border-color: #ddd1ec;
            color: #775c9e;
        }

        .filter-badge {
            display: none;

            min-width: 18px;
            height: 18px;

            padding: 0 5px;

            border-radius: 999px;

            background: #8d72b8;
            color: white;

            font-size: 11px;

            align-items: center;
            justify-content: center;
        }

        .filter-badge.visible {
            display: flex;
        }

        /* =========================
           篩選選單
           ========================= */

        .filter-menu {
            position: absolute;

            top: calc(100% + 7px);
            right: 0;

            z-index: 200;

            width: 190px;

            padding: 8px;

            border: 1px solid #e5e0e8;
            border-radius: 11px;

            background: white;

            box-shadow:
                0 10px 30px rgba(40, 30, 50, 0.12);

            display: none;
        }

        .filter-menu.open {
            display: block;
        }

        .filter-title {
            padding: 6px 8px 8px;

            color: #77717e;

            font-size: 12px;
            font-weight: 600;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 8px;

            width: 100%;

            padding: 9px 8px;

            border-radius: 7px;

            cursor: pointer;

            color: #59535f;

            font-size: 13px;
        }

        .filter-option:hover {
            background: #f6f3f8;
        }

        .filter-option input {
            width: 15px;
            height: 15px;

            margin: 0;

            accent-color: #8d72b8;

            cursor: pointer;
        }

        .filter-option-icon {
            width: 18px;
        }

        /* =========================
           重新整理
           ========================= */

        .refresh-button {
            border: 1px solid #e3dfe7;
            background: white;

            padding: 9px 14px;
            border-radius: 9px;

            color: #625d68;
            cursor: pointer;

            transition: 0.15s;
        }

        .refresh-button:hover {
            background: #f8f7fa;
        }

        /* =========================
           Table
           ========================= */

        .table-wrapper {
            overflow-x: auto;

            background: white;

            border: 1px solid #e8e4eb;
            border-radius: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #faf9fb;
        }

        th,
        td {
            padding: 14px 16px;

            text-align: left;

            border-bottom: 1px solid #eeeaf0;

            font-size: 14px;
        }

        th {
            color: #77717e;
            font-size: 13px;
            font-weight: 600;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #fcfbfd;
        }

        /* 欄位 */

        .index {
            width: 30px;

            color: #aaa4af;
            font-weight: 600;
        }

        .song {
            font-weight: 600;
        }

        .user {
            color: #68616f;
        }

        /* =========================
           Status
           ========================= */

        .status-container {
            position: relative;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            min-width: 95px;

            padding: 7px 10px;

            border: 1px solid #e4dfe8;
            border-radius: 8px;

            background: #faf9fb;

            color: #59535f;

            cursor: pointer;

            font-size: 13px;
        }

        .status-button::after {
            content: "▼";

            margin-left: auto;

            font-size: 9px;
            color: #99929f;
        }

        .status-button.queued {
            background: #f1ebf9;
            border-color: #e1d5ef;
            color: #775c9e;
        }

        .status-button.completed {
            background: #eaf6ef;
            border-color: #d5eadf;
            color: #4d8968;
        }

        .status-button.cancelled {
            background: #fbecee;
            border-color: #efd8dc;
            color: #ae626d;
        }

        /* =========================
           Status Dropdown
           ========================= */

        .status-menu {
            position: absolute;

            top: calc(100% + 5px);
            left: 0;

            z-index: 100;

            width: 120px;

            padding: 5px;

            border: 1px solid #e5e0e8;
            border-radius: 9px;

            background: white;

            box-shadow:
                0 8px 25px rgba(40, 30, 50, 0.10);

            display: none;
        }

        .status-menu.open {
            display: block;
        }

        .status-option {
            width: 100%;

            padding: 8px 10px;

            border: none;
            border-radius: 6px;

            background: transparent;

            text-align: left;

            cursor: pointer;

            font-size: 13px;
        }

        .status-option:hover {
            background: #f5f2f7;
        }

        /* =========================
           Update Button
           ========================= */

        .update-button {
            padding: 7px 11px;

            border: none;
            border-radius: 8px;

            background: #8d72b8;
            color: white;

            cursor: pointer;

            font-size: 13px;

            display: none;
        }

        .update-button:hover {
            background: #795ea5;
        }

        .update-button.visible {
            display: inline-block;
        }

        .update-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* =========================
           Empty / Loading / Error
           ========================= */

        .message {
            padding: 50px 20px;

            text-align: center;

            color: #99929f;

            font-size: 14px;
        }

        .error {
            color: #b55e69;
        }

        /* =========================
           Mobile
           ========================= */

        @media (max-width: 600px) {

            .container {
                width: calc(100% - 20px);
                margin: 20px auto;
            }

            .header {
                align-items: flex-start;
            }

            .title h1 {
                font-size: 19px;
            }

            .header-actions {
                gap: 5px;
            }

            .filter-button {
                padding: 8px 10px;
            }

            .refresh-button {
                padding: 8px 10px;
            }

            th,
            td {
                padding: 7px;
            }

            .filter-menu {
                right: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         Header
         ========================= -->

    <header class="header">

        <div class="title">

            <div class="title-icon">
                🎵
            </div>

            <div>
                <h1>今日點歌</h1>

                <div
                    class="count"
                    id="orderCount"
                >
                    載入中...
                </div>
            </div>

        </div>


        <!-- =========================
             Header 操作
             ========================= -->

        <div class="header-actions">

            <!-- 篩選 -->

            <div class="filter-wrapper">

                <button
                    type="button"
                    class="filter-button"
                    id="filterButton"
                >
                    ☰ 篩選

                    <span
                        class="filter-badge"
                        id="filterBadge"
                    >
                        0
                    </span>
                </button>


                <div
                    class="filter-menu"
                    id="filterMenu"
                >

                    <div class="filter-title">
                        篩選
                    </div>


                    <label class="filter-option">

                        <input
                            type="checkbox"
                            value="queued"
                            data-filter-status
                        >

                        <span class="filter-option-icon">
                            🟣
                        </span>

                        <span>
                            排隊
                        </span>

                    </label>


                    <label class="filter-option">

                        <input
                            type="checkbox"
                            value="completed"
                            data-filter-status
                        >

                        <span class="filter-option-icon">
                            🟢
                        </span>

                        <span>
                            完成
                        </span>

                    </label>


                    <label class="filter-option">

                        <input
                            type="checkbox"
                            value="cancelled"
                            data-filter-status
                        >

                        <span class="filter-option-icon">
                            🔴
                        </span>

                        <span>
                            取消
                        </span>

                    </label>

                </div>

            </div>


            <!-- 重新整理 -->

            <button
                class="refresh-button"
                id="refreshButton"
            >
                ↻ 重新整理
            </button>

        </div>

    </header>


    <!-- =========================
         Table
         ========================= -->

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th class="index">
                        序號
                    </th>

                    <th>
                        歌手 - 歌名
                    </th>

                    <th>
                        點歌人
                    </th>

                    <th>
                        狀態
                    </th>

                </tr>

            </thead>


            <tbody id="orderList">

                <tr>

                    <td
                        colspan="4"
                        class="message"
                    >
                        載入中...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

/* =========================================================
   API
   ========================================================= */

const API_URL =
    "https://song-list.shiroshio0507.workers.dev/api/songlist";


const PATCH_API_URL =
    "https://song-list.shiroshio0507.workers.dev/api/order";


/* =========================================================
   狀態設定
   ========================================================= */

const STATUS = {

    queued: {
        label: "排隊",
        className: "queued",
        icon: "🟣"
    },

    completed: {
        label: "完成",
        className: "completed",
        icon: "🟢"
    },

    cancelled: {
        label: "取消",
        className: "cancelled",
        icon: "🔴"
    }

};


/* =========================================================
   DOM
   ========================================================= */

const orderList =
    document.getElementById("orderList");

const orderCount =
    document.getElementById("orderCount");

const refreshButton =
    document.getElementById("refreshButton");

const filterButton =
    document.getElementById("filterButton");

const filterMenu =
    document.getElementById("filterMenu");

const filterBadge =
    document.getElementById("filterBadge");


/* =========================================================
   資料
   ========================================================= */

/*
 * API 取得的完整資料。
 *
 * 篩選不會修改這份資料，
 * 這樣重新整理或切換篩選時可以直接重新 Render。
 */

let allOrders = [];


/*
 * 使用 Set 保存目前被排除的 status。
 *
 * 例如：
 *
 * Set {
 *     "completed",
 *     "cancelled"
 * }
 *
 * 代表：
 * 排除完成 + 排除取消
 */

const excludedStatuses = new Set();


/* =========================================================
   自動刷新
   ========================================================= */

const AUTO_REFRESH_INTERVAL =
    60 * 1000; // 1 分鐘

let refreshTimer = null;

let isLoading = false;


/* =========================================================
   載入今日點歌
   ========================================================= */

async function loadOrders() {

    // 防止手動刷新與自動刷新同時發送請求
    if (isLoading) {
        return;
    }

    isLoading = true;


    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                "API 回傳 success=false"
            );

        }


        allOrders =
            Array.isArray(data.orders)
                ? data.orders
                : [];


        /*
         * API 已經依 created_at ASC，
         * 這裡再保險排序一次。
         */

        allOrders.sort(
            (a, b) =>
                new Date(a.created_at) -
                new Date(b.created_at)
        );


        /*
         * 使用目前篩選條件重新顯示。
         */

        renderOrders();


    } catch (error) {

        console.error(
            "取得點歌資料失敗:",
            error
        );


        /*
         * 自動刷新失敗時不要清除目前畫面。
         */

    } finally {

        isLoading = false;

        scheduleAutoRefresh();

    }

}


/* =========================================================
   自動刷新計時器
   ========================================================= */

function scheduleAutoRefresh() {

    if (refreshTimer) {

        clearTimeout(
            refreshTimer
        );

    }


    refreshTimer =
        setTimeout(
            () => {

                loadOrders();

            },
            AUTO_REFRESH_INTERVAL
        );

}


/* =========================================================
   套用篩選
   ========================================================= */

function getFilteredOrders() {

    return allOrders.filter(
        order => {

            const status =
                String(
                    order.status || ""
                ).trim();


            /*
             * 如果 status 在 excludedStatuses
             * 裡面，就排除。
             */

            return !excludedStatuses.has(
                status
            );

        }
    );

}


/* =========================================================
   Render
   ========================================================= */

function renderOrders() {

    const orders =
        getFilteredOrders();


    /*
     * 顯示篩選後的數量。
     */

    orderCount.textContent =
        `${orders.length} 首`;


    /* =========================
       沒有資料
       ========================= */

    if (orders.length === 0) {

        /*
         * 區分：
         *
         * 1. 今天完全沒有點歌
         * 2. 有點歌，但被篩選掉
         */

        const message =
            allOrders.length === 0
                ? "今天還沒有點歌"
                : "沒有符合篩選條件的點歌";


        orderList.innerHTML = `
            <tr>

                <td
                    colspan="4"
                    class="message"
                >
                    ${message}
                </td>

            </tr>
        `;

        return;
    }


    /* =========================
       Render
       ========================= */

    orderList.innerHTML =
        orders
            .map(
                (order, index) =>
                    createOrderRow(
                        order,
                        index
                    )
            )
            .join("");


    bindStatusEvents();

}


/* =========================================================
   建立單筆資料
   ========================================================= */

function createOrderRow(
    order,
    index
) {

    /*
     * anonymous → 顯示「匿名」
     *
     * 但 data-user 必須保留原本的
     * anonymous，PATCH 才能通過 Worker 驗證。
     */

    const displayUser =
        order.user_name === "anonymous"
            ? "匿名"
            : (
                order.user_name ||
                "匿名"
            );


    const status =
        String(
            order.status || ""
        ).trim();


    const statusInfo =
        STATUS[status];


    /*
     * 防止未知 status 讓整個列表崩潰。
     */

    if (!statusInfo) {

        console.error(
            "未知的 status:",
            order.status,
            order
        );

        return "";

    }


    return `

        <tr
            data-id="${escapeHtml(order.id)}"
            data-song-name="${escapeHtml(order.song_name)}"
            data-user="${escapeHtml(order.user_name || "")}"
        >

            <td class="index">
                #${index + 1}
            </td>


            <td class="song">

                ${escapeHtml(order.artist)}
                -
                ${escapeHtml(order.song_name)}

            </td>


            <td class="user">

                👤 ${escapeHtml(displayUser)}

            </td>


            <td>

                <div
                    class="status-container"
                    data-status="${status}"
                >

                    <button
                        type="button"
                        class="status-button ${statusInfo.className}"
                        data-action="toggle"
                    >

                        ${statusInfo.icon}
                        ${statusInfo.label}

                    </button>


                    <div class="status-menu">

                        ${Object.entries(STATUS)
                            .map(
                                ([key, value]) => `

                                    <button
                                        type="button"
                                        class="status-option"
                                        data-status="${key}"
                                    >

                                        ${value.icon}
                                        ${value.label}

                                    </button>

                                `
                            )
                            .join("")}

                    </div>


                    <button
                        type="button"
                        class="update-button"
                        data-action="update"
                    >
                        更新
                    </button>

                </div>

            </td>

        </tr>

    `;

}


/* =========================================================
   狀態 UI 事件
   ========================================================= */

function bindStatusEvents() {

    /*
     * 開關狀態下拉選單
     */

    document
        .querySelectorAll(
            '[data-action="toggle"]'
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        const container =
                            button.closest(
                                ".status-container"
                            );


                        closeAllMenus(
                            container
                        );


                        container
                            .querySelector(
                                ".status-menu"
                            )
                            .classList.toggle(
                                "open"
                            );

                    }
                );

            }
        );


    /*
     * 選擇狀態
     */

    document
        .querySelectorAll(
            ".status-option"
        )
        .forEach(
            option => {

                option.addEventListener(
                    "click",
                    () => {

                        const container =
                            option.closest(
                                ".status-container"
                            );


                        const newStatus =
                            option.dataset.status;


                        const oldStatus =
                            container.dataset.status;


                        /*
                         * 沒有改變狀態
                         */

                        if (
                            newStatus ===
                            oldStatus
                        ) {

                            container
                                .querySelector(
                                    ".status-menu"
                                )
                                .classList
                                .remove(
                                    "open"
                                );

                            return;

                        }


                        /*
                         * 暫存新狀態。
                         *
                         * 此時還沒有 PATCH。
                         */

                        container.dataset.pendingStatus =
                            newStatus;


                        const button =
                            container.querySelector(
                                ".status-button"
                            );


                        button.className =
                            `status-button ${STATUS[newStatus].className}`;


                        button.innerHTML =
                            `${STATUS[newStatus].icon}
                             ${STATUS[newStatus].label}`;


                        /*
                         * 顯示更新按鈕
                         */

                        container
                            .querySelector(
                                ".update-button"
                            )
                            .classList
                            .add(
                                "visible"
                            );


                        container
                            .querySelector(
                                ".status-menu"
                            )
                            .classList
                            .remove(
                                "open"
                            );

                    }
                );

            }
        );


    /*
     * PATCH 更新
     */

    document
        .querySelectorAll(
            '[data-action="update"]'
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        updateOrderStatus(
                            button
                        );

                    }
                );

            }
        );

}


/* =========================================================
   更新狀態
   ========================================================= */

async function updateOrderStatus(
    updateButton
) {

    const container =
        updateButton.closest(
            ".status-container"
        );


    const row =
        updateButton.closest("tr");


    const id =
        row.dataset.id;


    const newStatus =
        container.dataset.pendingStatus;


    /*
     * Worker 需要：
     *
     * 1. status
     * 2. songName
     * 3. user
     */

    const songName =
        row.dataset.songName;


    const user =
        row.dataset.user;


    if (!newStatus) {
        return;
    }


    updateButton.disabled = true;

    updateButton.textContent =
        "更新中...";


    try {

        const response =
            await fetch(
                `${PATCH_API_URL}/${encodeURIComponent(id)}`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        status:
                            newStatus,

                        songName:
                            songName,

                        user:
                            user

                    })
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                `HTTP ${response.status}`
            );

        }


        /*
         * 更新成功。
         */

        container.dataset.status =
            newStatus;


        delete container.dataset.pendingStatus;


        updateButton
            .classList
            .remove(
                "visible"
            );


        updateButton.disabled =
            false;


        updateButton.textContent =
            "更新";


        /*
         * 同步本地資料。
         *
         * 這樣不用重新 GET API，
         * 畫面上的篩選也會維持。
         */

        const targetOrder =
            allOrders.find(
                order =>
                    String(order.id) ===
                    String(id)
            );


        if (targetOrder) {

            targetOrder.status =
                newStatus;

        }


        /*
         * 如果剛剛修改成被排除的狀態，
         * 立即從畫面移除。
         */

        renderOrders();


        console.log(
            `訂單 #${id} 狀態更新成功`
        );


    } catch (error) {

        console.error(
            "更新點歌狀態失敗:",
            error
        );


        updateButton.disabled =
            false;


        updateButton.textContent =
            "更新";


        /*
         * 重新取得伺服器資料。
         */

        await loadOrders();


        alert(
            `狀態更新失敗\n${error.message}`
        );

    }

}


/* =========================================================
   篩選 UI
   ========================================================= */

/*
 * 開關篩選選單
 */

filterButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();


        closeAllMenus();


        filterMenu
            .classList
            .toggle(
                "open"
            );

    }
);


/*
 * 篩選 checkbox
 */

document
    .querySelectorAll(
        "[data-filter-status]"
    )
    .forEach(
        checkbox => {

            checkbox.addEventListener(
                "change",
                () => {

                    const status =
                        checkbox.value;


                    if (
                        checkbox.checked
                    ) {

                        excludedStatuses.add(
                            status
                        );

                    } else {

                        excludedStatuses.delete(
                            status
                        );

                    }


                    updateFilterUI();

                    renderOrders();

                }
            );

        }
    );


/* =========================================================
   更新篩選 UI
   ========================================================= */

function updateFilterUI() {

    const count =
        excludedStatuses.size;


    /*
     * 顯示 / 隱藏數字 Badge
     */

    if (count > 0) {

        filterBadge.textContent =
            count;

        filterBadge
            .classList
            .add(
                "visible"
            );

        filterButton
            .classList
            .add(
                "active"
            );

    } else {

        filterBadge
            .classList
            .remove(
                "visible"
            );

        filterButton
            .classList
            .remove(
                "active"
            );

    }

}


/* =========================================================
   關閉所有選單
   ========================================================= */

function closeAllMenus(
    except = null
) {

    /*
     * 關閉狀態選單
     */

    document
        .querySelectorAll(
            ".status-menu.open"
        )
        .forEach(
            menu => {

                const container =
                    menu.closest(
                        ".status-container"
                    );


                if (
                    container !== except
                ) {

                    menu
                        .classList
                        .remove(
                            "open"
                        );

                }

            }
        );


    /*
     * 關閉篩選選單
     */

    if (
        except !== filterMenu
    ) {

        filterMenu
            .classList
            .remove(
                "open"
            );

    }

}


/* =========================================================
   點擊其他地方 → 關閉選單
   ========================================================= */

document.addEventListener(
    "click",
    () => {

        closeAllMenus();

    }
);


/* =========================================================
   重新整理
   ========================================================= */

refreshButton.addEventListener(
    "click",
    async () => {

        await loadOrders();

    }
);


/* =========================================================
   HTML Escape
   ========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   初始化
   ========================================================= */

loadOrders();

</script>

</body>
</html>
