<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>今日點歌</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100dvh;
            background: #f5f5f7;
            color: #29262f;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                sans-serif;
        }

        .container {
            width: min(1000px, calc(100% - 32px));
            min-height: calc(100dvh - 80px);
            margin: 40px auto;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           Header
           ========================= */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 18px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;
            background: #eee8f7;

            font-size: 20px;
        }

        .title h1 {
            margin: 0;
            font-size: 22px;
        }

        .count {
            margin-top: 3px;
            color: #918c98;
            font-size: 13px;
        }

        .refresh-button {
            border: 1px solid #e3dfe7;
            background: white;

            padding: 9px 14px;
            border-radius: 9px;

            color: #625d68;
            cursor: pointer;

            transition: 0.15s;
        }

        .refresh-button:hover {
            background: #f8f7fa;
        }

        .filter-container {
            position: relative;
            margin-bottom: 14px;
        }

        .header .filter-container {
            margin-bottom: 0;
            margin-left: auto;
        }

        .filter-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 14px;
            border: 1px solid #e3dfe7;
            border-radius: 9px;
            background: white;
            color: #59535f;
            cursor: pointer;
        }

        .filter-button:hover {
            background: #f8f7fa;
        }

        .filter-menu {
            position: absolute;
            top: calc(100% + 5px);
            bottom: auto;
            left: 0;
            z-index: 100;
            display: none;
            width: 150px;
            padding: 6px;
            border: 1px solid #e5e0e8;
            border-radius: 9px;
            background: white;
            box-shadow: 0 8px 25px rgba(40, 30, 50, 0.10);
        }

        .filter-menu.open {
            display: block;
        }

        .filter-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 6px;
            color: #59535f;
            cursor: pointer;
            font-size: 13px;
        }

        .filter-option:hover {
            background: #f5f2f7;
        }

        /* =========================
           Table
           ========================= */

        .table-wrapper {
            flex: 1;
            min-height: 0;
            overflow-x: auto;
            overflow-y: auto;

            background-color: rgba(255, 255, 255, 0.22);
            background-image: url("img/IMG_0537.png");
            background-position: center bottom;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: local;

            border: 1px solid #e8e4eb;
            border-radius: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;

            /*min-width: 650px;*/
        }

        thead {
            background: #faf9fb;
        }

        th,
        td {
            padding: 14px 16px;

            text-align: left;

            border-bottom: 1px solid #eeeaf0;

            font-size: 14px;
        }

        th {
            color: #77717e;
            font-size: 13px;
            font-weight: 600;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody td {
            background: rgba(255, 255, 255, 0.58);
            backdrop-filter: blur(4px);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.68);
        }

        tbody tr:hover td {
            background: rgba(255, 255, 255, 0.68);
        }

        tbody tr:first-child td:first-child {
            border-top-left-radius: 10px;
        }

        tbody tr:first-child td:last-child {
            border-top-right-radius: 10px;
        }

        tbody tr:last-child td:first-child {
            border-bottom-left-radius: 10px;
        }

        tbody tr:last-child td:last-child {
            border-bottom-right-radius: 10px;
        }

        /* 欄位 */

        .index {
            width: 7%;

            color: #aaa4af;
            font-weight: 600;
        }

        th:nth-child(2),
        td:nth-child(2) {
            width: 50%;
        }

        th:nth-child(3),
        td:nth-child(3) {
            width: 17%;
        }

        th:nth-child(4),
        td:nth-child(4) {
            width: 26%;
        }

        .song {
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .song [data-action="copy-song"] {
            display: inline-block;
            padding: 0 2px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .song [data-action="copy-song"]:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(141, 114, 184, 0.35);
            box-shadow: 0 4px 10px rgba(90, 70, 120, 0.1);
            backdrop-filter: blur(2px);
            transform: translateY(-2px);
        }

        .user {
            color: #68616f;
        }

        /* =========================
           Status
           ========================= */

        .status-container {
            position: relative;

            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            min-width: 0;
        }

        .status-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            flex: 1 1 auto;
            min-width: 0;

            padding: 7px 10px;

            border: 1px solid #e4dfe8;
            border-radius: 8px;

            background: #faf9fb;

            color: #59535f;

            cursor: pointer;

            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
        }

        .status-button::after {
            content: "▼";

            margin-left: auto;

            font-size: 9px;
            color: #99929f;
        }

        .status-button.queued {
            background: #f1ebf9;
            border-color: #e1d5ef;
            color: #775c9e;
        }

        .status-button.completed {
            background: #eaf6ef;
            border-color: #d5eadf;
            color: #4d8968;
        }

        .status-button.cancelled {
            background: #fbecee;
            border-color: #efd8dc;
            color: #ae626d;
        }

        /* =========================
           Dropdown
           ========================= */

        .status-menu {
            position: absolute;

            top: auto;
            bottom: calc(100% + 5px);
            left: 0;

            z-index: 100;

            width: 120px;

            padding: 5px;

            border: 1px solid #e5e0e8;
            border-radius: 9px;

            background: white;

            box-shadow:
                0 8px 25px rgba(40, 30, 50, 0.10);

            display: none;
        }

        .status-menu.open {
            display: block;
        }

        .status-option {
            width: 100%;

            padding: 8px 10px;

            border: none;
            border-radius: 6px;

            background: transparent;

            text-align: left;

            cursor: pointer;

            font-size: 13px;
        }

        .status-option:hover {
            background: #f5f2f7;
        }

        /* =========================
           Update Button
           ========================= */

        .update-button {
            padding: 7px 11px;

            border: none;
            border-radius: 8px;

            background: #8d72b8;
            color: white;

            cursor: pointer;

            font-size: 13px;

            display: none;
        }

        .update-button:hover {
            background: #795ea5;
        }

        .update-button.visible {
            display: inline-block;
        }

        .update-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .cancel-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            margin-left: 0;
            border: 1px solid #efd8dc;
            border-radius: 8px;
            background: #fbecee;
            color: #ae626d;
            cursor: pointer;
        }

        .cancel-button:hover {
            background: #f5dce0;
        }

        .cancel-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* =========================
           Empty / Loading / Error
           ========================= */

        .message {
            padding: 50px 20px;

            text-align: center;

            color: #99929f;

            font-size: 14px;
        }

        .error {
            color: #b55e69;
        }

        /* =========================
           Mobile
           ========================= */

        @media (max-width: 600px) {
            .container {
                width: calc(100% - 20px);
                min-height: calc(100dvh - 40px);
                margin: 20px auto;
            }

            .header {
                align-items: flex-start;
            }

            .title h1 {
                font-size: 19px;
            }

            .refresh-button {
                padding: 8px 10px;
            }

            th,
            td {
                padding: 7px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         Header
         ========================= -->

    <header class="header">

        <div class="title">

            <div class="title-icon">
                🎵
            </div>

            <div>
                <h1>今日點歌</h1>

                <div
                    class="count"
                    id="orderCount"
                >
                    載入中...
                </div>
            </div>

        </div>

        <div class="filter-container">
            <button
                type="button"
                class="filter-button"
                id="filterButton"
                aria-expanded="false"
            >
                <i class="fa-solid fa-filter"></i>
                篩選
            </button>

            <div class="filter-menu" id="filterMenu">
                <label class="filter-option">
                    <input type="checkbox" data-hidden-status="queued">
                    隱藏排隊中
                </label>
                <label class="filter-option">
                    <input type="checkbox" data-hidden-status="completed">
                    隱藏完成
                </label>
                <label class="filter-option">
                    <input type="checkbox" data-hidden-status="cancelled">
                    隱藏取消
                </label>
            </div>
        </div>

        <button
            class="refresh-button"
            id="refreshButton"
        >
            ↻ 重新整理
        </button>

    </header>

    <!-- =========================
         Table
         ========================= -->

    <div class="table-wrapper">

        <table>

            <thead>

                <tr>
                    <th class="index">
                        序號
                    </th>

                    <th>
                        歌手 - 歌名
                    </th>

                    <th>
                        點歌人
                    </th>

                    <th>
                        狀態
                    </th>
                </tr>

            </thead>

            <tbody id="orderList">

                <tr>
                    <td
                        colspan="4"
                        class="message"
                    >
                        載入中...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

/* =========================================================
   API
   ========================================================= */

const API_URL =
    "https://song-list.shiroshio0507.workers.dev/api/songlist";


/* =========================================================
   狀態設定
   ========================================================= */

const STATUS = {

    queued: {
        label: "排隊中",
        className: "queued",
        icon: "🟣"
    },

    completed: {
        label: "完成",
        className: "completed",
        icon: "🟢"
    },

    cancelled: {
        label: "取消",
        className: "cancelled",
        icon: "🔴"
    }

};


/* =========================================================
   DOM
   ========================================================= */

const orderList =
    document.getElementById("orderList");

const orderCount =
    document.getElementById("orderCount");

const refreshButton =
    document.getElementById("refreshButton");

const filterButton =
    document.getElementById("filterButton");

const filterMenu =
    document.getElementById("filterMenu");

const filterCheckboxes =
    filterMenu.querySelectorAll("input[data-hidden-status]");

const HIDDEN_STATUS_STORAGE_KEY =
    "songlist-hidden-statuses";

let allOrders = [];
let hiddenStatuses = new Set();

try {
    const savedStatuses = JSON.parse(
        localStorage.getItem(HIDDEN_STATUS_STORAGE_KEY) || "[]"
    );

    hiddenStatuses = new Set(
        savedStatuses.filter(status => STATUS[status])
    );
} catch (error) {
    console.warn("讀取篩選條件失敗:", error);
}

filterCheckboxes.forEach(checkbox => {
    checkbox.checked = hiddenStatuses.has(
        checkbox.dataset.hiddenStatus
    );

    checkbox.addEventListener("change", () => {
        const status = checkbox.dataset.hiddenStatus;

        if (checkbox.checked) {
            hiddenStatuses.add(status);
        } else {
            hiddenStatuses.delete(status);
        }

        saveHiddenStatuses();
        renderOrders(allOrders);
    });
});

function saveHiddenStatuses() {
    localStorage.setItem(
        HIDDEN_STATUS_STORAGE_KEY,
        JSON.stringify([...hiddenStatuses])
    );
}

filterButton.addEventListener("click", event => {
    event.stopPropagation();
    filterMenu.classList.toggle("open");
    filterButton.setAttribute(
        "aria-expanded",
        filterMenu.classList.contains("open")
    );
});


/* =========================================================
   載入今日點歌
   ========================================================= */

const AUTO_REFRESH_INTERVAL = 60 * 1000; // 1 分鐘

let refreshTimer = null;
let isLoading = false;

async function loadOrders() {

    // 防止手動刷新與自動刷新同時發送請求
    if (isLoading) {
        return;
    }

    isLoading = true;

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.success) {
            throw new Error("API 回傳 success=false");
        }

        const orders =
            Array.isArray(data.orders)
                ? data.orders
                : [];

        allOrders = orders;
        renderOrders(allOrders);

    } catch (error) {

        console.error(
            "取得點歌資料失敗:",
            error
        );

        /*
         * 注意：
         * 自動刷新失敗時不要清掉目前畫面。
         * 保留使用者目前看到的資料。
         */

    } finally {

        isLoading = false;

        scheduleAutoRefresh();
    }
}

function scheduleAutoRefresh() {

    // 清除上一個計時器
    if (refreshTimer) {
        clearTimeout(refreshTimer);
    }

    refreshTimer = setTimeout(() => {

        loadOrders();

    }, AUTO_REFRESH_INTERVAL);
}

/* =========================================================
   Render
   ========================================================= */

function renderOrders(orders) {

    orders.sort(
        (a, b) =>
            new Date(a.created_at) -
            new Date(b.created_at)
    );

    const visibleOrders = orders.filter(order =>
        !hiddenStatuses.has(order.status)
    );

    orderCount.textContent =
        hiddenStatuses.size === 0
            ? `${orders.length} 首`
            : `${visibleOrders.length} / ${orders.length} 首`;


    if (visibleOrders.length === 0) {

        orderList.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="message"
                >
                    ${orders.length === 0
                        ? "今天還沒有點歌"
                        : "沒有符合篩選的點歌"}
                </td>
            </tr>
        `;

        return;
    }


    orderList.innerHTML =
        visibleOrders
            .map((order, index) =>
                createOrderRow(
                    order,
                    index
                )
            )
            .join("");


    /*
     * 綁定狀態按鈕
     */

    bindStatusEvents();

}


/* =========================================================
   建立單筆資料
   ========================================================= */

function createOrderRow(order, index) {
    const displayUser =
        order.user_name === "anonymous"
            ? "匿名"
            : (order.user_name || "匿名");

    const status =
        String(order.status || "").trim();

    const statusInfo =
        STATUS[status];

    if (!statusInfo) {

        console.error(
            "未知的 status:",
            order.status,
            order
        );

        return "";
    }


    return `
        <tr
            data-id="${escapeHtml(order.id)}"
            data-song-name="${escapeHtml(order.song_name)}"
            data-user="${escapeHtml(order.user_name || "")}"
        >

            <td class="index">
                #${index + 1}
            </td>

            <td class="song">
                <span
                    data-action="copy-song"
                    data-song-name="${escapeHtml(order.song_name)}"
                    title="點擊複製歌名"
                >
                ${escapeHtml(order.artist)}
                -
                ${escapeHtml(order.song_name)}
                </span>
            </td>

            <td class="user">
                👤 ${escapeHtml(displayUser)}
            </td>

            <td>

                <div
                    class="status-container"
                    data-status="${status}"
                >

                    <button
                        type="button"
                        class="status-button ${statusInfo.className}"
                        data-action="toggle"
                    >
                        ${statusInfo.icon}
                        ${statusInfo.label}
                    </button>


                    <div class="status-menu">

                        ${Object.entries(STATUS)
                            .filter(([key]) => key !== "cancelled")
                            .map(([key, value]) => `
                                <button
                                    type="button"
                                    class="status-option"
                                    data-status="${key}"
                                >
                                    ${value.icon}
                                    ${value.label}
                                </button>
                            `)
                            .join("")}

                    </div>


                    <button
                        type="button"
                        class="update-button"
                        data-action="update"
                    >
                        更新
                    </button>

                    <button
                        type="button"
                        class="cancel-button"
                        data-action="cancel"
                        aria-label="取消點歌"
                        title="取消點歌"
                        ${status === "cancelled" ? "disabled" : ""}
                    >
                        <i class="fa-solid fa-trash-can"></i>
                    </button>

                </div>

            </td>

        </tr>
    `;
}


/* =========================================================
   狀態 UI 事件
   ========================================================= */

function bindStatusEvents() {

    document
        .querySelectorAll(
            '[data-action="copy-song"]'
        )
        .forEach(song => {

            song.addEventListener(
                "click",
                async event => {

                    event.stopPropagation();

                    try {
                        await navigator.clipboard.writeText(
                            song.dataset.songName
                        );
                    } catch (error) {
                        console.error(
                            "複製歌名失敗:",
                            error
                        );
                    }

                }
            );

        });

    /*
     * 開關下拉選單
     */

    document
        .querySelectorAll(
            '[data-action="toggle"]'
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    const container =
                        button.closest(
                            ".status-container"
                        );

                    closeAllMenus(
                        container
                    );

                    container
                        .querySelector(
                            ".status-menu"
                        )
                        .classList.toggle(
                            "open"
                        );

                }
            );

        });


    /*
     * 選擇狀態
     */

    document
        .querySelectorAll(
            ".status-option"
        )
        .forEach(option => {

            option.addEventListener(
                "click",
                () => {

                    const container =
                        option.closest(
                            ".status-container"
                        );

                    const newStatus =
                        option.dataset.status;


                    /*
                     * 取得目前狀態
                     */

                    const oldStatus =
                        container.dataset.status;


                    /*

                        const statusButton = container.querySelector(
                            ".status-button"
                        );

                        statusButton.className =
                            `status-button ${STATUS[newStatus].className}`;

                        statusButton.innerHTML =
                            `${STATUS[newStatus].icon}
                             ${STATUS[newStatus].label}`;
                     * 如果沒有改變，
                     * 不顯示更新按鈕。
                     */

                    if (
                        newStatus === oldStatus
                    ) {

                        container
                            .querySelector(
                                ".status-menu"
                            )
                            .classList.remove(
                                "open"
                            );

                        return;

                    }


                    /*
                     * 暫存新狀態
                     *
                     * 注意：
                     * 這裡還沒有 PATCH。
                     */

                    container.dataset.pendingStatus =
                        newStatus;


                    const button =
                        container.querySelector(
                            ".status-button"
                        );


                    button.className =
                        `status-button ${STATUS[newStatus].className}`;

                    button.innerHTML =
                        `${STATUS[newStatus].icon}
                         ${STATUS[newStatus].label}`;


                    /*
                     * 顯示更新按鈕
                     */

                    container
                        .querySelector(
                            ".update-button"
                        )
                        .classList.add(
                            "visible"
                        );


                    container
                        .querySelector(
                            ".status-menu"
                        )
                        .classList.remove(
                            "open"
                        );

                }
            );

        });


    /*
     * PATCH 更新
     */

    document
        .querySelectorAll(
            '[data-action="update"]'
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    updateOrderStatus(
                        button
                    );

                }
            );

        });

    document
        .querySelectorAll(
            '[data-action="cancel"]'
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    updateOrderStatus(
                        button,
                        "cancelled"
                    );

                }
            );

        });

}


/* =========================================================
   更新狀態
   ========================================================= */

async function updateOrderStatus(updateButton, forcedStatus = null) {

    const container =
        updateButton.closest(".status-container");

    const row =
        updateButton.closest("tr");

    // ==========================================
    // 從目前這一列取得資料
    // ==========================================

    const id =
        row.dataset.id;

    const newStatus =
        forcedStatus || container.dataset.pendingStatus;

    // 歌手 - 歌名那一欄
    // 注意：Worker 只需要 song_name
    const songName =
        row.dataset.songName;

    // 點歌人
    const user =
        row.dataset.user;


    if (!newStatus) {
        return;
    }


    // ==========================================
    // 防止重複點擊
    // ==========================================

    updateButton.disabled = true;
    if (updateButton.dataset.action === "update") {
        updateButton.textContent = "更新中...";
    }


    try {

        const response = await fetch(
            `https://song-list.shiroshio0507.workers.dev/api/order/${encodeURIComponent(id)}`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: newStatus,

                    // 必須與 D1 完全一致
                    songName: songName,

                    // 必須與 D1 完全一致
                    user: user
                })
            }
        );


        const data = await response.json();


        // ==========================================
        // Worker 回傳錯誤
        // ==========================================

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                `HTTP ${response.status}`
            );

        }


        // ==========================================
        // 更新成功
        // ==========================================

        container.dataset.status =
            newStatus;

        delete container.dataset.pendingStatus;


        const pendingUpdateButton = container.querySelector(
            '[data-action="update"]'
        );

        pendingUpdateButton
            .classList
            .remove("visible");

        updateButton.disabled = false;
        if (updateButton.dataset.action === "update") {
            updateButton.textContent = "更新";
        }

        if (newStatus === "cancelled") {
            container.querySelector('[data-action="cancel"]').disabled = true;
        }


        console.log(
            `訂單 #${id} 狀態更新成功`
        );

        await loadOrders();


    } catch (error) {

        console.error(
            "更新點歌狀態失敗:",
            error
        );


        updateButton.disabled = false;
        updateButton.textContent = "更新";


        /*
         * 重新抓 API
         *
         * 讓畫面恢復成 D1 真正的狀態。
         */

        await loadOrders();


        alert(
            `狀態更新失敗\n${error.message}`
        );
    }
}

/* =========================================================
   關閉所有下拉選單
   ========================================================= */

function closeAllMenus(
    except = null
) {

    document
        .querySelectorAll(
            ".status-menu.open"
        )
        .forEach(menu => {

            const container =
                menu.closest(
                    ".status-container"
                );

            if (
                container !== except
            ) {

                menu.classList.remove(
                    "open"
                );

            }

        });

}


/* =========================================================
   點擊其他地方 → 關閉選單
   ========================================================= */

document.addEventListener(
    "click",
    () => {

        closeAllMenus();
        filterMenu.classList.remove("open");
        filterButton.setAttribute("aria-expanded", "false");

    }
);


/* =========================================================
   重新整理
   ========================================================= */

refreshButton.addEventListener(
    "click",
    async () => {
        await loadOrders();
    }
);


/* =========================================================
   HTML Escape
   防止 API 資料直接注入 HTML
   ========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   初始化
   ========================================================= */

loadOrders();

</script>

</html>
